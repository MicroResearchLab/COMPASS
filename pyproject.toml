[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-ms"
version = "0.1.0"
description = "COMPASS mass spectrometry analysis"
readme = "README.md"
requires-python = ">=3.8,<3.13"

# Runtime dependencies remain in requirements.txt pending Python 3.12 validation.
# Install this project as well to enforce requires-python during installation.

[tool.setuptools]
py-modules = [
    "arg_parser",
    "class_model",
    "com_data_create",
    "Embedding",
    "fpr_model",
    "main",
    "model",
    "MSNs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Library", "Library.*", "toolbox", "toolbox.*"]
namespaces = true
